<!doctype html>
<html lang="nl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#465e9e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MuzIVOtheek" />
    <meta name="description" content="Bladmuziek lezen, afspeellijsten en krabbels. Werkt offline." />
    <title>MuzIVOtheek</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="modulepreload" href="vendor/pdfjs/pdf.min.mjs" />
  </head>
  <body>
    <header class="app-header">
      <img class="brand-logo" src="branding/eendracht.png" alt="Eendracht Aalten" />
      <div class="brand-name">MuzIVOtheek</div>
    </header>

    <main id="main">
      <section class="tab" id="tab-songs"></section>
      <section class="tab" id="tab-lists" hidden></section>
      <section class="tab" id="tab-tools" hidden></section>
      <section class="tab" id="tab-settings" hidden></section>
    </main>

    <button type="button" id="fab" class="fab" aria-label="Toevoegen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
    </button>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button type="button" data-tab="songs" class="active">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="17" cy="16" r="3" /></svg>Nummers
      </button>
      <button type="button" data-tab="lists">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13" /><circle cx="3.5" cy="6" r="1" /><circle cx="3.5" cy="12" r="1" /><circle cx="3.5" cy="18" r="1" /></svg>Lijsten
      </button>
      <button type="button" data-tab="tools">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l4 18H4z" /><path d="M12 17l5-10" /><path d="M7 17h10" /></svg>Tools
      </button>
      <button type="button" data-tab="settings">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>Instellingen
      </button>
    </nav>

    <div id="viewer" class="viewer" hidden></div>
    <div id="progress" class="progress" hidden><span></span><div class="bar"><i></i></div></div>
    <div id="drop" class="drop">Laat los om toe te voegen</div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
