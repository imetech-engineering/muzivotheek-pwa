# Publiceert de map pwa/ op GitHub Pages.
# Eenmalig: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Deploy Muzivotheek

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Bouwen en uploaden in een aparte job: de publicatie-job start pas als de
  # upload helemaal klaar is. In één job vond deploy-pages het bestand soms nog
  # niet ("No artifacts named github-pages were found").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versie stempelen
        run: |
          BUILD="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/${BUILD}/g" pwa/service-worker.js pwa/js/update.js pwa/js/phonelink.js
          grep -q "$BUILD" pwa/service-worker.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
